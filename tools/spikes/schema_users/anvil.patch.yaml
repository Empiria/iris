db_schema:
  spike_row:
    client: none
    server: full
    title: spike_row
    columns:
    - name: name
      admin_ui: {width: 200, order: 0}
      type: string
    - name: "n"
      admin_ui: {width: 200, order: 1}
      type: number
  users:
    client: none
    server: full
    title: Users
    columns:
    - name: email
      admin_ui: {width: 200, order: 0}
      type: string
    - name: enabled
      admin_ui: {width: 100, order: 1}
      type: bool
    - name: last_login
      admin_ui: {width: 200, order: 2}
      type: datetime
    - name: password_hash
      admin_ui: {width: 200, order: 3}
      type: string
    - name: n_password_failures
      admin_ui: {width: 200, order: 4}
      type: number
    - name: confirmed_email
      admin_ui: {width: 100, order: 5}
      type: bool
    - name: signed_up
      admin_ui: {width: 200, order: 6}
      type: datetime
    - name: remembered_logins
      admin_ui: {width: 200, order: 7}
      type: simpleObject
    - name: is_staff
      admin_ui: {width: 100, order: 8}
      type: bool
services:
- source: /runtime/services/anvil/users.yml
  client_config:
    allow_signup: false
    confirm_email: false
    enable_automatically: true
    use_email: true
    allow_remember_me: true
    remember_me_days: 30
    require_secure_passwords: false
    share_login_status: false
    use_token: false
    use_google: false
    use_facebook: false
    use_microsoft: false
    use_saml: false
  server_config:
    user_table: users
