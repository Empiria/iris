<main class="iris-page">
  <section class="iris-card">
    <h1 class="iris-heading">Iframe matrix</h1>
    <p class="iris-lede">
      Room name:
      <input type="text" anvil:dom-node="room_input" autocomplete="off">
    </p>
    <button type="button" anvil:on-dom:click="self._join_click">Join</button>
    <p class="iris-lede" anvil:dom-node="matrix_status">Not joined</p>
    <iframe
      anvil:dom-node="matrix_frame"
      title="VDO.Ninja room"
      allow="camera; microphone; autoplay; display-capture"
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen
      hidden
      width="100%"
      height="600"></iframe>
  </section>
</main>
