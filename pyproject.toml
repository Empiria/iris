[project]
name = "iris-dev"
version = "0.0.0"
description = "Dev and test tooling for Iris. The app itself is not a Python package."
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "anvil-uplink>=0.7.1",
    "pytest>=9.2",
    "pytest-playwright>=0.10",
    # Exact pin: the sandbox has this release's chromium build cached, and a
    # newer wheel would want a build that `playwright install` can't fetch there.
    "playwright==1.65.2",
    "pyyaml>=6.0",
    # Bundles axe-core, so the accessibility e2e test needs no network.
    "axe-playwright-python>=0.1.7",
    # Exact pin so CI and every checkout lint and format alike. Keep it equal to the
    # rev in .pre-commit-config.yaml. anvil-pyright is an npm package, pinned in
    # .github/workflows/ci.yml, not a Python one.
    "ruff==0.17.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
# No default test path, on purpose: run `just unit` or `just e2e`. A bare `pytest tests`
# collects both suites, and tests/conftest.py refuses that.
# --confcutdir=tests keeps the repo root out of the collection tree. The root holds
# the Anvil app's __init__.py, which pytest would otherwise import as a package
# and which fails outside the Anvil runtime (it reads __path__ without defining it).
addopts = "-ra --confcutdir=tests"
markers = [
    "e2e: drives a browser against the local stack",
]
