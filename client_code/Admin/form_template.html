<main class="iris-page">
  <anvil-component name="loading_card" type="form:StatusCard"
                   prop:text="Checking your session"></anvil-component>
  <anvil-component name="signin_card" type="form:SignInCard"></anvil-component>
  <section class="iris-card" anvil:dom-node="signed_in_card" hidden>
    <h1 class="iris-heading">Admin</h1>
    <p class="iris-lede" anvil:dom-node="signed_in_as"></p>
    <button type="button" class="iris-button" anvil:dom-node="signout_button"
            anvil:on-dom:click="self._on_sign_out">Sign out</button>
    <div anvil:dom-node="admin_tools">
      <anvil-component name="create_meeting" type="form:CreateMeeting"></anvil-component>
      <anvil-component name="rooms_list" type="form:RoomsList"></anvil-component>
      <anvil-component name="call_settings" type="form:CallSettings"></anvil-component>
    </div>
  </section>
</main>
